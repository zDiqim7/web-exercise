<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZmH+zLeBuhoNP1a5x5c5qI5B9zzTtmI3UksdQRVvoxMfooAo5tJfF1F7C6X8zT4yKg==" crossorigin="anonymous" referrerpolicy="no-referrer" /> -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wdth,wght@102.6,300..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    
    <div class="search-box">
      <button type="button" class="search-btn">
        <i class="fa-solid fa-location-dot"></i>
      </button>
      <input type="text" placeholder="Enter your location">
      <button type="button" class="search-btn" data-role="search">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
      <label for="search-btn"></label>
    </div>

    <div class="not-found">
      <img src="images/404.png" alt="Eror 404 - Not found">
      <p>Oops! Invalid Location :/</p>
    </div>

    <div class="weather-box">
      <img src="">
      <p class="temperature"></p>
      <p class="description"></p>
    </div>

    <div class="weather-details">
      <div class="humidity">
        <i class="fa-solid fa-water"></i>
        <div class="text-group">
          <span></span>
          <p>Humidity</p>
        </div>
      </div>
      <div class="wind">
        <i class="fa-solid fa-wind"></i>
        <div class="text-group">
          <span></span>
          <p>Wind Speed</p>
        </div>
      </div>
    </div>

  </div>


  <script src="https://kit.fontawesome.com/fe859e1085.js" crossorigin="anonymous"></script>
  <script src="index.js"></script>
</body>
</html>
